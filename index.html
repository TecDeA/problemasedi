<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problemas de Electrónica Digital - IES Virgen de Villadiego</title>
        <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c3e50">
<link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="favicon.ico" type="image/vnd.icon">

    <style>
        /* --- ESTILOS GENERALES --- */
        :root {
            --primary-color: #2c3e50; /* Azul oscuro */
            --accent-color: #3498db;  /* Azul brillante */
            --hover-color: #2980b9;   /* Azul más oscuro para hover */
            --text-color: #333;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            color: var(--text-color);
        }

        /* --- ENCABEZADO --- */
        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 1rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 3px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 10px;
        }

        h2 {
            color: #555;
            font-size: 1.2rem;
            font-weight: 400;
            margin-top: 0;
        }

        /* --- CONTENEDOR DE BOTONES (GRID) --- */
        .container {
            width: 90%;
            max-width: 1000px;
            display: grid;
            /* Crea columnas automáticas con un ancho mínimo de 250px */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* --- ESTILO DE LOS BOTONES --- */
        .card-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            padding: 2rem;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            border-left: 5px solid var(--accent-color);
        }

        /* Efecto Hover */
        .card-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            background-color: var(--primary-color);
        }

        .card-link:hover .card-title, 
        .card-link:hover .icon {
            color: white;
        }

        /* Texto del botón */
        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 15px;
            transition: color 0.3s;
        }

        /* Icono decorativo (simulado con CSS) */
        .icon {
            font-size: 2rem;
            color: var(--accent-color);
            transition: color 0.3s;
        }

        /* --- PIE DE PÁGINA --- */
        footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #777;
            padding: 1rem;
        }

        /* --- ANIMACIONES --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- RESPONSIVIDAD PARA MÓVILES PEQUEÑOS --- */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1rem; }
        }

        /* --- CHIP DINÁMICO DE VERSIÓN (leída de sw.js) --- */
        .version-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 1rem;
            padding: 5px 14px 5px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-color), var(--hover-color));
            box-shadow: 0 3px 8px rgba(52, 152, 219, 0.35);
            min-width: 110px;
            justify-content: center;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        .version-chip::before {
            content: '';
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5);
            animation: chip-pulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        .version-chip.loading::before {
            background: #f1c40f;
            animation: chip-pulse 1s ease-in-out infinite;
        }

        .version-chip.error {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 3px 8px rgba(231, 76, 60, 0.35);
        }

        .version-chip.error::before {
            background: #fff;
            animation: none;
        }

        .version-chip.updated {
            animation: chip-bounce 0.6s ease;
        }

        @keyframes chip-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        @keyframes chip-bounce {
            0% { transform: scale(1); }
            40% { transform: scale(1.15); }
            70% { transform: scale(0.96); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>COLECCIONES DE PROBLEMAS DE ELECTRÓNICA DIGITAL</h1>
        <h2>DEPARTAMENTO DE TECNOLOGÍA IES VIRGEN DE VILLADIEGO</h2>
        <div id="version-chip" class="version-chip loading" title="Versión de la caché tomada de sw.js">
            <span id="version-chip-text">cargando…</span>
        </div>
    </header>

<main class="container">
        <a href="ColeccionEDI1.html" class="card-link" target="_blank" rel="noopener noreferrer">

    <footer>
        &copy; 2026 by angelmicelti y Gemini
    </footer>

<script>
  (function () {
    const chip = document.getElementById('version-chip');
    const chipText = document.getElementById('version-chip-text');

    /**
     * Descarga sw.js como texto y extrae el valor de CACHE_NAME.
     * Usamos cache: 'no-store' para evitar leer una copia en caché
     * y reflejar siempre la versión real del Service Worker activo.
     */
    function actualizarVersionChip() {
      fetch('./sw.js', { cache: 'no-store' })
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(text => {
          // Captura: CACHE_NAME = 'edi-v6'  |  "edi-v6"  |  `edi-v6`
          const match = text.match(/CACHE_NAME\s*=\s*['"`]([^'"`]+)['"`]/);
          if (match && match[1]) {
            // Elimina el prefijo "edi-" (si existe) para mostrar solo la versión,
            // p. ej. "edi-v2.1" -> "v2.1", "edi-v6" -> "v6"
            const version = match[1].replace(/^edi-/i, '');
            chip.classList.remove('loading', 'error');
            chip.classList.add('updated');
            // Quita la clase de rebote al terminar la animación
            setTimeout(() => chip.classList.remove('updated'), 600);
            chipText.textContent = version;
            chip.title = 'Service Worker: CACHE_NAME = "' + match[1] + '"';
          } else {
            chip.classList.remove('loading');
            chip.classList.add('error');
            chipText.textContent = 'versión no encontrada';
          }
        })
        .catch(() => {
          chip.classList.remove('loading');
          chip.classList.add('error');
          chipText.textContent = 'sw.js no disponible';
        });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('Service Worker registrado con éxito:', registration.scope);
            actualizarVersionChip();

            // Si hay una nueva versión del SW esperando, recargar el chip al activarse
            navigator.serviceWorker.addEventListener('controllerchange', actualizarVersionChip);

            // Detectar actualizaciones del SW ya registrado
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    actualizarVersionChip();
                  }
                });
              }
            });
          })
          .catch(error => {
            console.log('Fallo al registrar el Service Worker:', error);
            actualizarVersionChip();
          });
      });
    } else {
      // Sin soporte de SW: aún intentamos leer sw.js para mostrar la versión
      actualizarVersionChip();
    }
  })();
</script>
</body>
</html>
